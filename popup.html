    <div id="sync-status" role="status"></div>
    <div id="exam-banner" class="setting-row" hidden>
      <span id="exam-banner-text" class="setting-help" role="status"></span>
      <button
        type="button"
        id="exam-banner-action"
        class="playlist-action playlist-primary"
        hidden
      ></button>
    </div>
    <div id="playlist-status" aria-live="polite" hidden></div>

    <div class="container" id="lecture"></div>
    <div class="container" id="assignment">
      <div class="loading">
        <h2>즐겨찾기 과목을 확인하는 중이에요</h2>
        <div class="spinner"></div>
        <div class="connection-status">
          <span id="status-text">강의와 과제를 불러오고 있어요</span>
        </div>
      </div>
    </div>

    <details id="completed" class="completed-panel" hidden>
      <summary>
        완료한 항목
        <span id="completed-count" class="badge" data-count="0">0</span>
      </summary>
